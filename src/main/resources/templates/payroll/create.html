<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">
	
	<head>
		<link rel="stylesheet" th:href="@{/styles/common.css}">
		<link rel="stylesheet" th:href="@{/styles/navbar.css}">
		<link rel="stylesheet" th:href="@{/styles/payroll/payroll-creation.css}">
	</head>
	<body>
		
		<div th:replace="~{fragments/navbar :: top-navbar}"></div>
		<div th:replace="~{fragments/navbar :: navbar}"></div>
		
		<div class="main" id="main">
		
			<div class="sub-main">
			
				<div class="parameters-panel">
				
					<p>PAYROLL CYCLE CREATION</p>
		
					<label for="payroll-type">Type</label>
					<select id="payroll-type" class="payroll-type">
						<option value="monthly">Monthly</option>
						<option value="bi-monthly">Bi-monthly</option>
						<option value="weekly">Weekly</option>
						<option value="daily">Daily</option>
						<option value="custom">Custom</option>
					</select>
			
					<div id="custom-payroll-duration"></div>
					
					<br>
					<label for="payroll-start">Start Date:&nbsp;</label>
					<input type="date" id="payroll-start">
			
					<button id="createPayroll">Create</button>
		
					<br><br>
					
					<div class="shift-container">
					
						<p>Time of Shift</p>
						
						<div class="shift-parameter-container">
							<label for="shift-hours">Hours of shift:</label>
							<input type="number" id="shift-hours"><br><br>
						
							<label for="shift-start">Start</label>
							<input type="time" id="shift-start">
							
							<br>
							<label for="shift-end">End</label>
							<input type="time" id="shift-end">
						</div>
					</div>
					
					<div class="working-days-container">
						<div class="working-days-subcontainer">
							
							<p id="paragraph">Working Days:</p>
							
							<div class="preset-container">
								
								<ul>
									
									<li>
										<input type="radio" class="preset-options" name="working-days" value="whole-week" id="whole-week">
										<label for="whole-week">whole week</label>
									</li>
									<li>
										<input type="radio" class="preset-options" name="working-days" value="weekdays" id="weekdays">
										<label for="weekdays">weekdays</label>
									</li>
									<li>
										<input type="radio" class="preset-options" name="working-days" value="weekends" id="weekends">
										<label for="weekends">weekends</label>
									</li>
									<li>
										<input type="radio" class="preset-options" name="working-days" value="custom" id="custom">
										<label for="custom">custom</label>
									</li>
									<li>
										<input type="radio" class="preset-options" name="working-days" value="irregular" id="irregular">
										<label for="custom">irregular</label>
									</li>
								
								</ul>
															
							</div>
							<div class="days-container">
							
								<ul>
									<li>
										<input class="day-options day-option-weekend" type="checkbox" value="Sunday" id="sunday-checkbox">
										<label for="sunday-checkbox">Sunday</label>
									</li>
								
									<li>
										<input class="day-options day-option-weekday" type="checkbox" value="Monday" id="monday-checkbox">
										<label for="monday-checkbox">Monday</label>
									</li>
								
									<li>
										<input class="day-options day-option-weekday" type="checkbox" value="Tuesday" id="tuesday-checkbox">
										<label for="tuesday-checkbox">Tuesday</label>
									</li>
								
									<li>
										<input class="day-options day-option-weekday" type="checkbox" value="Wednesday" id="wednesday-checkbox">
										<label for="wednesday-checkbox">Wednesday</label>
									</li>
								
									<li>
										<input class="day-options day-option-weekday" type="checkbox" value="Thursday" id="thursday-checkbox">
										<label for="thursday-checkbox">Thursday</label>																											
									</li>
								
									<li>
										<input class="day-options day-option-weekday" type="checkbox" value="Friday" id="friday-checkbox">
										<label for="friday-checkbox">Friday</label>
									</li>
								
									<li>
										<input class="day-options day-option-weekend" type="checkbox" value="Saturday" id="saturday-checkbox">
										<label for="saturday-checkbox">Saturday</label>
									</li>
							
								</ul>
							
							</div>
																			
						</div>
					</div>
		
						
			
					<label for="selection">Assigned to:&nbsp;</label>
					<select id="selection" class="payroll-assignment"></select>
			
					<br>
			
					<button id="publish">Publish</button>
					
				</div>
				
				<div class="output-panel">
				
					<h3>Cycles</h3>
					<div id="cycles">
							<table>
            					<thead>
                					<tr>
										<th>Number</th>
                	  		  			<th>Start</th>
            	        				<th>End</th>
            	    				</tr>
            					</thead>
            					<tbody>
            						<tr>
										<td>1</td>
          		      					<td>---</td>
           		     					<td>---</td>
            						</tr>
           	 					</tbody>
        					</table>
        				
					</div>
					
				</div>
			</div>
		</div>
	
	</body>
	
	<script th:src="@{/scripts/library/jquery-3.7.1.min.js}"></script>
	<script type="module" th:src="@{/scripts/payroll/planning.js}"></script>
	<script type="module" th:src="@{/scripts/common/tools.js}"></script>
	
	
</html>
