<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">
	<head>
		<link rel="stylesheet" th:href="@{styles/common.css}">
		<link rel="stylesheet" th:href="@{styles/navbar.css}">
	</head>
	
	<body>
		
		<div th:replace="~{fragments/navbar :: top-navbar}"></div>
		<div th:replace="~{fragments/navbar :: navbar}"></div>
		
		<div class="main" id="main">
		
			<div class="sub-main">
			
				<div class="employees-container">
				
					<label for="selection">Employee Roles</label>
					<select id="selection"></select><br>
		
		
					<table>
						<thead>
							<tr>
								<td>Employee Names</td>
							</tr>
						</thead>
						<tbody id="employees"></tbody>
					</table>
					
				</div>
				
			<!--<div id="contain_period"></div>-->
			
				<div class="output-panel">
				
					<label for="test">Period</label>
					<div id="contain_period">
						<select id="test"></select>
					</div>
		
					<div id="table-container">
				
						<table>
							<thead>
								<tr>
									<td>DAY</td>
									<td>TIME-IN</td>
									<td>TIME-OUT</td>
								<tr>
							</thead>
							<tbody id="dates"></tbody>
						</table>
					
					</div>
				
				</div>
				
			</div>
		</div>
		
	</body>
	
	<script th:src="@{/scripts/library/jquery-3.7.1.min.js}"></script>
	<script type="module" th:src="@{/scripts/audit/audittingEmployee.js}"></script>
	<script type="module" th:src="@{/scripts/common/calendarCreation.js}"></script>
	<script type="module" th:src="@{/scripts/common/tools.js}"></script>
	
</html>
